<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>출근길 메트로</title>
<style>
:root { --paper: #fbf8ef; --paper2: #f3eee0; --ink: #2c3440; --mute: #7b8494; --edge: #ddd4be;
  --accent: #2f8f5b; --accent-d: #1f6b42; --blue: #2b6cb0; --blue-d: #1e4f85; --warn: #d64545; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #d5d9c2; color: var(--ink);
  font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
body { display: flex; flex-direction: column; height: 100dvh; }
svg.ic { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card { background: var(--paper); border: 1px solid var(--edge); border-radius: 12px;
  box-shadow: 0 2px 0 rgba(120,105,70,0.20), 0 5px 12px rgba(60,50,30,0.10); }
button { font: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
button:disabled { opacity: 0.4; cursor: default; }

/* ---------- 위쪽 줄 ---------- */
#hud { display: flex; align-items: center; gap: 6px; padding: 6px 8px 5px; white-space: nowrap; }
#city { display: flex; align-items: center; gap: 7px; padding: 3px 10px 3px 4px; }
#dial { width: 34px; height: 34px; position: relative; flex: none; }
#dial svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
#dialIcon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #e09a1a; }
#cityName { font-weight: 800; font-size: 14px; line-height: 1.15; }
#cityLine { font-size: 11px; color: var(--mute); line-height: 1.2; }
#cityLine b { color: var(--ink); }
#chips { display: flex; gap: 5px; align-items: center; min-width: 0; overflow: hidden; }
.chip { display: flex; align-items: center; gap: 4px; padding: 5px 8px; font-size: 13px; font-weight: 700; }
.chip svg { color: var(--mute); }
.chip small { font-weight: 600; font-size: 10px; color: var(--mute); margin-right: 1px; }
.chip.bad { color: var(--warn); } .chip.bad svg { color: var(--warn); }
#hud .sp { flex: 1; }
.ctl { display: flex; padding: 3px; gap: 2px; }
.ctl button { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--mute); }
.ctl button:hover { background: var(--paper2); }
.ctl button.on { background: var(--accent); color: #fff; box-shadow: 0 2px 0 var(--accent-d); }

/* ---------- 왼쪽 노선 팔레트 ---------- */
#main { flex: 1; display: flex; min-height: 0; padding: 0 8px 8px; gap: 8px; }
#tools { width: 132px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; overflow-x: hidden; padding-bottom: 3px; scrollbar-width: none; }
#tools::-webkit-scrollbar { display: none; }
.cap { font-size: 10px; font-weight: 800; color: var(--mute); letter-spacing: 0.5px; padding: 5px 8px 2px; }
.lines { padding-bottom: 4px; }
button.line { --c: #888; display: flex; align-items: center; gap: 5px; width: calc(100% - 8px); margin: 2px 4px; padding: 4px 6px 4px 9px;
  border-radius: 8px; position: relative; font-size: 12px; font-weight: 700; min-height: 32px; text-align: left; white-space: nowrap; }
button.line::before { content: ''; position: absolute; left: 2px; top: 4px; bottom: 4px; width: 4px; border-radius: 2px; background: var(--c); }
button.line svg { color: var(--c); }
button.line small { position: absolute; right: 6px; top: 4px; font-size: 10.5px; font-weight: 800; color: var(--ink); }
button.line .ln { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; flex: 1; }
button.line .ln b { font-size: 12px; } button.line .ln em { font-style: normal; font-size: 9.5px; font-weight: 600; color: var(--mute); }
button.line.dim { opacity: 0.45; }
button.line.on { background: #fff; box-shadow: 0 0 0 2px var(--c), 0 2px 5px rgba(0,0,0,0.12); }
.acts { padding-bottom: 5px; }
.acts .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 2px 5px; }
.acts button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 36px; border-radius: 8px;
  background: var(--paper2); border: 1px solid var(--edge); font-size: 10px; font-weight: 700; color: var(--ink); }
.acts button:active { transform: translateY(1px); }
.acts button.wide { grid-column: 1 / 3; flex-direction: row; gap: 5px; font-size: 11.5px; min-height: 32px; }
.acts button.on { background: #ffe9a8; border-color: #d9a400; }
.acts button.danger { color: var(--warn); }

/* ---------- 지도 ---------- */
#wrap { flex: 1; position: relative; min-width: 0; border-radius: 14px; overflow: hidden;
  border: 3px solid #c9bf9f; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 3px 0 rgba(120,105,70,0.25), 0 6px 14px rgba(60,50,30,0.14); background: #d5d9c2; }
canvas { display: block; touch-action: none; }
.pop { position: absolute; z-index: 5; }
.coach { position: absolute; z-index: 4; top: 8px; left: 50%; transform: translateX(-50%); width: min(470px, calc(100% - 16px));
  background: rgba(255,253,246,0.97); border: 2px solid var(--accent); border-radius: 13px; padding: 8px 12px; box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  font-size: 13px; line-height: 1.45; display: flex; align-items: center; gap: 10px; }
.coach.hide { display: none; }
.coach .cstep { font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 9px; padding: 2px 7px; white-space: nowrap; }
.coach .ctext { flex: 1; }
.coach .cbtns { display: flex; flex-direction: column; gap: 4px; }
.coach button { font-size: 11px; font-weight: 700; color: var(--mute); padding: 3px 6px; white-space: nowrap; }
.coach button.go { color: #fff; background: var(--accent); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 800; }
.acts button.tut { animation: tutPulse 0.9s ease-in-out infinite; border-color: var(--accent); }
@keyframes tutPulse { 50% { box-shadow: 0 0 0 4px rgba(47,143,91,0.45); background: #e3f4e8; } }
.set { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.set label { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.set label span { width: 56px; }
.set input[type=range] { flex: 1; accent-color: var(--accent); }
.set label b { width: 38px; text-align: right; font-size: 12px; color: var(--mute); }
.set .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.setbtns { display: flex; gap: 8px; margin-bottom: 8px; }
.btn.danger { background: #fff; color: var(--warn); border: 2px solid var(--warn); box-shadow: 0 3px 0 var(--warn); font-size: 14px; }
.tips { background: var(--paper2); border: 1px solid var(--edge); border-radius: 10px; padding: 7px 10px; margin: 0 0 8px; font-size: 12.5px; line-height: 1.45; }
.tips:empty { display: none; }
.adrow { display: flex; gap: 8px; margin-top: 8px; }
.adbtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; border-radius: 10px; background: #fff7dc;
  border: 1.5px solid #e0b43a; color: #8a5d00; font-size: 12.5px; font-weight: 800; }
.adbtn:disabled, .adbig:disabled { opacity: 0.45; }
.adbtn[hidden], .adbig[hidden] { display: none; }
.btn.adbig { background: #f0b429; color: #3a2a00; box-shadow: 0 3px 0 #b8820a; margin-bottom: 6px; }
.adtag { font-size: 10px; font-weight: 800; background: #3a2a00; color: #ffd76a; border-radius: 5px; padding: 1px 5px; }
.premlink { text-align: center; font-size: 12px; margin: 4px 0 6px; }
.premlink:empty { display: none; }
.premlink button, .linkbtn { color: var(--blue); font-weight: 700; text-decoration: underline; font-size: 12px; }
.linkbtn { display: block; margin: 6px auto 0; }
.setlinks { display: flex; justify-content: center; gap: 16px; }
.setlinks .linkbtn { margin: 10px 0 0; }
.perks { margin: 10px 0; padding-left: 18px; line-height: 1.55; }
.premstate { text-align: center; font-weight: 800; margin-bottom: 8px; color: var(--accent-d); }
.premstate:empty { display: none; }
.tips .th { font-weight: 800; margin-bottom: 2px; }
.tips ul { margin: 2px 0 0; padding-left: 16px; }
.tips .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 2px; border: 1px solid rgba(0,0,0,0.3); }
.pop.hide { display: none; }
.pop button { display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 10px; background: #fff; color: #c0392b;
  font-size: 13px; font-weight: 800; border: 2px solid var(--c, #c0392b); box-shadow: 0 3px 0 rgba(0,0,0,0.18); white-space: nowrap; }

/* ---------- 덮는 화면 ---------- */
.overlay { position: absolute; inset: 0; background: rgba(46,52,40,0.50); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 10px; }
.overlay.hide { display: none; }
.panel { padding: 16px 20px; max-width: 600px; width: 100%; max-height: 100%; overflow: auto; line-height: 1.5; font-size: 13.5px; border-radius: 16px; }
.panel h2 { margin: 0; font-size: 21px; font-weight: 800; }
.panel .sub { color: var(--mute); font-size: 12.5px; margin: 2px 0 8px; }
.panel ul { margin: 6px 0 10px; padding-left: 18px; }
.panel li { margin: 2px 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 42px; border-radius: 11px;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 var(--accent-d); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-d); }
.btn.blue { background: var(--blue); box-shadow: 0 3px 0 var(--blue-d); }
.btn.ghost { background: #fff; color: var(--accent-d); box-shadow: 0 3px 0 var(--accent-d); border: 2px solid var(--accent); }
.seed { font-size: 11px; font-weight: 700; color: #8a8270; }
.btnrow { display: flex; gap: 8px; position: sticky; bottom: 0; padding-top: 6px; background: linear-gradient(transparent, var(--paper) 30%); }
/* 결과 창 아래: 부활 버튼까지 함께 고정해서 화면이 낮아도 가려지지 않게 */
.foot { position: sticky; bottom: 0; padding-top: 6px; background: linear-gradient(transparent, var(--paper) 14px); }
.foot .btnrow { position: static; background: none; }
.rewards { display: flex; gap: 8px; margin-top: 10px; }
.rewards button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 13px; text-align: center;
  background: #fff; border: 2px solid var(--edge); box-shadow: 0 3px 0 rgba(120,105,70,0.25); }
.rewards button:hover { border-color: var(--accent); }
.rewards button:active { transform: translateY(2px); }
.rewards .ric { width: 46px; height: 46px; border-radius: 50%; background: #e7f3ea; color: var(--accent); display: flex; align-items: center; justify-content: center; }
.rewards b { font-size: 14px; }
.rewards span { font-size: 11px; color: var(--mute); line-height: 1.3; }
.grade { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 13px; margin-bottom: 2px; }
.grade.good { background: #e3f4e8; color: #1f6b42; } .grade.ok { background: #fff3d1; color: #8a6200; } .grade.bad { background: #fde3e3; color: #b02a2a; }
.cities { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 6px; scrollbar-width: thin; }
.citycard { flex: none; width: 104px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 9px; border-radius: 11px;
  background: #fff; border: 2px solid var(--edge); text-align: left; box-shadow: 0 2px 0 rgba(120,105,70,0.22); }
.citycard b { font-size: 13px; } .citycard span { font-size: 10px; color: var(--mute); line-height: 1.25; min-height: 25px; }
.citycard i { font-style: normal; font-size: 12px; color: #e0a100; letter-spacing: 1px; }
.citycard.on { border-color: var(--accent); background: #eef8f1; }
.citycard.locked { background: var(--paper2); opacity: 0.7; } .citycard.locked i { color: var(--mute); font-size: 10px; letter-spacing: 0; }
.cityinfo { font-size: 12.5px; line-height: 1.45; background: var(--paper2); border-radius: 10px; padding: 7px 10px; margin: 2px 0 6px; }
.howcap { font-size: 11px; font-weight: 800; color: var(--accent-d); margin-top: 6px; }
details summary { cursor: pointer; font-size: 12px; color: var(--mute); font-weight: 700; }
.stats { display: flex; gap: 8px; margin: 10px 0; }
.stats div { flex: 1; background: var(--paper2); border-radius: 10px; padding: 8px; text-align: center; font-size: 11px; color: var(--mute); }
.stats b { display: block; font-size: 20px; color: var(--ink); }
@media (max-height: 480px) {
  .panel { font-size: 12px; line-height: 1.38; padding: 10px 16px; } .panel h2 { font-size: 17px; }
  #hud { padding: 4px 8px 4px; } #main { padding: 0 6px 6px; gap: 6px; } #tools { width: 126px; }
  .stats { margin: 6px 0; } .stats div { padding: 4px 6px; } .stats b { font-size: 16px; }
  button.line { min-height: 29px; padding-top: 2px; padding-bottom: 2px; } .acts button { min-height: 33px; }
}
@media (max-width: 900px) { .chip.opt { display: none; } }
</style>
</head>
<body>
<div id="hud">
  <div id="city" class="card">
    <div id="dial">
      <svg class="ring" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14.5" fill="none" stroke="#e9e2cf" stroke-width="4"/>
        <circle id="dialRing" cx="17" cy="17" r="14.5" fill="none" stroke="#f0b429" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100"/></svg>
      <div id="dialIcon"></div>
    </div>
    <div><div id="cityName"></div><div id="cityLine"></div></div>
  </div>
  <div id="chips">
    <div class="chip card opt" title="인구"><span data-ic="people"></span><small>인구</small><span id="vPop">0</span></div>
    <div class="chip card" id="satChip" title="시민 만족도"><span data-ic="smile"></span><span id="vSat">100%</span></div>
    <div class="chip card" title="수송한 승객"><span data-ic="pin"></span><span id="vDelivered">0</span></div>
    <div class="chip card" title="남은 선로"><span data-ic="track"></span><span id="vTrack">0</span></div>
    <div class="chip card" id="bridgeChip" title="남은 다리"><span data-ic="bridge"></span><span id="vBridge">0</span></div>
    <div class="chip card" title="여유 버스"><span data-ic="bus"></span><span id="vBus">0</span></div>
    <div class="chip card" title="여유 열차"><span data-ic="train"></span><span id="vTrain">0</span></div>
    <div class="chip card" id="ferryChip" title="여유 여객선" style="display:none"><span data-ic="ferry"></span><span id="vFerry">0</span></div>
  </div>
  <span class="sp"></span>
  <div class="ctl card">
    <button id="homeBtn" title="도시 선택으로"><span data-ic="home"></span></button>
    <button id="saveBtn" title="저장"><span data-ic="save"></span></button>
    <button id="muteBtn" title="소리"></button>
    <button id="setBtn" title="설정"><span data-ic="gear"></span></button>
  </div>
  <div class="ctl card">
    <button data-speed="0" title="멈춤"><span data-ic="pause"></span></button>
    <button data-speed="1" class="on" title="보통"><span data-ic="play"></span></button>
    <button data-speed="2" title="빠르게"><span data-ic="fast"></span></button>
  </div>
</div>
<div id="main">
  <div id="tools"></div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="stopPop" class="pop hide"><button id="popDel"></button></div>
    <div id="coach" class="coach hide"><div class="cstep" id="cStep"></div><div class="ctext" id="cText"></div>
      <div class="cbtns"><button id="cSkip">건너뛰기</button><button id="cNext" class="go" style="display:none"></button></div></div>
    <div id="start" class="overlay"><div class="panel card" style="max-width:660px">
      <h2>출근길 메트로</h2>
      <div class="sub">도시를 골라 교통국장으로 부임하세요. 8일을 버티면 완주이고 다음 도시가 열립니다.</div>
      <div id="cityList" class="cities"></div>
      <div id="cityInfo" class="cityinfo"></div>
      <details><summary>게임 방법</summary><div id="howto"></div></details>
      <div class="btnrow">
        <button id="contBtn" class="btn blue" style="display:none"></button>
        <button id="sameBtn" class="btn ghost" style="display:none"></button>
        <button id="startBtn" class="btn">부임하기</button>
      </div>
    </div></div>
    <div id="reward" class="overlay hide"><div class="panel card" style="max-width:700px">
      <h2 id="rTitle"></h2>
      <div class="sub" id="rSub"></div>
      <div id="rGrade" class="grade"></div>
      <div class="rewards"><button id="r0"></button><button id="r1"></button><button id="r2"></button><button id="r3"></button></div>
      <div class="adrow"><button id="adReroll" class="adbtn"></button><button id="adMore" class="adbtn"></button></div>
      <div class="premlink" id="premR"></div>
    </div></div>
    <div id="settings" class="overlay hide"><div class="panel card" style="max-width:420px">
      <h2>설정</h2>
      <div class="set">
        <label><span>배경음</span><input type="range" id="sBgm" min="0" max="100" step="5"><b id="sBgmV"></b></label>
        <label><span>효과음</span><input type="range" id="sSfx" min="0" max="100" step="5"><b id="sSfxV"></b></label>
        <label class="chk"><span>진동</span><input type="checkbox" id="sVib"><i></i></label>
      </div>
      <div class="setbtns">
        <button id="sTut" class="btn ghost">튜토리얼 다시 하기</button>
        <button id="sReset" class="btn danger">진행 초기화</button>
      </div>
      <button id="sPrem" class="btn blue" style="margin-bottom:8px"></button>
      <div class="btnrow"><button id="sClose" class="btn">닫기</button></div>
      <div class="setlinks"><button id="sPrivacy" class="linkbtn">개인정보처리방침</button><button id="sAdPrivacy" class="linkbtn" style="display:none">광고 개인정보 설정</button></div>
    </div></div>
    <div id="premium" class="overlay hide"><div class="panel card" style="max-width:440px">
      <h2>프리미엄</h2>
      <div class="sub">한 번 구매로 계속 쓰는 상품입니다.</div>
      <ul class="perks">
        <li><b>판 사이 광고 없음</b></li>
        <li><b>광고 없이 보상</b>: 부활, 지원 다시 뽑기, 지원 하나 더를 광고를 보지 않고 바로 받습니다(하루 횟수는 같습니다).</li>
        <li>개발을 응원해 주셔서 고맙습니다. 앞으로 나올 도시와 기능도 이어서 만들어 가겠습니다.</li>
      </ul>
      <div id="premState" class="premstate"></div>
      <div class="btnrow"><button id="pBuy" class="btn blue">구매하기</button><button id="pClose" class="btn ghost">닫기</button></div>
      <button id="pRestore" class="linkbtn">구매 복원</button>
    </div></div>
    <div id="over" class="overlay hide"><div class="panel card" style="max-width:440px">
      <h2 id="oTitle">정류장 마비!</h2>
      <div class="sub"><b id="oCity"></b><span id="oWhy"></span></div>
      <div class="stats">
        <div><b id="oDay"></b>일차까지</div>
        <div><b id="oDelivered"></b>명 수송</div>
        <div><b id="oPop"></b>인구</div>
      </div>
      <div id="oTips" class="tips"></div>
      <p id="oBest" style="margin:0 0 8px;text-align:center;font-weight:700"></p>
      <div class="foot">
        <button id="reviveBtn" class="btn adbig"></button>
        <div class="premlink" id="premO"></div>
        <div class="btnrow"><button id="retryBtn" class="btn blue">같은 지도로 다시</button><button id="againBtn" class="btn">새 지도로</button></div>
      </div>
    </div></div>
  </div>
</div>
<script src="audio.js?v=16"></script>
<script src="render.js?v=16"></script>
<script>
'use strict';
// ---------- 수치 ----------
const W = 900, H = 420;
const DAY = 90;                 // 하루 길이(초)
const MODES = {
  bus: { name: '버스', cap: 6, speed: 55, w: 3, dwell: 0.5 },

  const s = { idx: stops.length, x: p.x, y: p.y, d: d.id, wait: [], over: 0, acc: Math.random(), hub: false, born: performance.now() / 1000 };
  stops.push(s);
  if (started) { fxRing(s.x, s.y, d.color, 46, 0.9, 4); fxBurst(s.x, s.y, d.color, 10, 80); sfxNewStop(); }
  rebuildD();
  return s;
}
// 구역의 빈 자리 하나에 정류장을 세운다
function addStop(d) {
  const free = freeSlots(d);
  if (!free.length) return null;
  const slot = free[Math.floor(rnd() * free.length)];
  slot.used = true;
  return createStop(slot, d);
}

// 다음 정류장 자리를 미리 정한다(예고용). 정류장이 가장 적은 구역 가운데 하나의 빈 자리
function planStop() {
  pendingStop = null;
  const open = districts.filter(d => d.built !== false && freeSlots(d).length);
  if (!open.length) return;
  const most = Math.max(...open.map(d => freeSlots(d).length));
  const cand = open.filter(d => freeSlots(d).length === most);
  const d = cand[Math.floor(rnd() * cand.length)], free = freeSlots(d);
  const k = d.slots.indexOf(free[Math.floor(rnd() * free.length)]);
  pendingStop = { x: d.slots[k].x, y: d.slots[k].y, d, k };
}
function spawnStop() {
  if (!pendingStop) planStop();
  if (pendingStop) {
    pendingStop.d.slots[pendingStop.k].used = true;
    createStop(pendingStop, pendingStop.d); flash('새 정류장이 생겼습니다');
  }
  pendingStop = null;
}
// 하루가 시작될 때 오늘의 정류장 수를 범위 안에서 정하고, 그만큼을 하루에 고르게 흩어 놓는다
function makeSchedule() {
  schedDay = day; sched = [];
  const have = stops.filter(s => s.d >= 0).length;
  const free = districts.filter(d => d.built !== false).reduce((n, d) => n + freeSlots(d).length, 0);
  const allFree = districts.reduce((n, d) => n + freeSlots(d).length, 0);
  let n, crowd = false;
  if (!allFree) { n = CROWD_PER_DAY; crowd = true; }
  else if (day >= GROW_FULL_DAY) n = free;
  else { const [lo, hi] = GROW[day - 1]; n = Math.max(0, Math.min(free, lo + Math.floor(rnd() * (hi - lo + 1)) - have)); }
  for (let i = 0; i < n; i++) sched.push({ t: Math.max(FORECAST * 0.5, DAY * (i + 0.15 + 0.7 * rnd()) / n), crowd });
}
function crowdUp() { crowdLv++; flash('도시가 더 붐빕니다 · 승객 +8%'); sfxWarn(); }

// ---------- 노선 ----------
function makeLines() {
  lines = [];
  for (const [mode, cols] of LINE_SETS) {
    cols.forEach((c, i) => lines.push({ mode, n: i + 1, color: c, stops: [], vehicles: [], extra: 0, boost: 0, unlocked: i < (city.start[mode] || 0) }));
  }
}

function dumpLoads(l) {
  for (const v of l.vehicles) { if (l.stops[v.i]) l.stops[v.i].wait.push(...v.load); v.load = []; }
}

// 차량 수를 맞추고 노선 위에 고르게 다시 세운다
function resetVehicles(l) {
  dumpLoads(l);
  l.vehicles = [];
  if (l.stops.length < 2) return;
  const count = vehCount(l), n = l.stops.length - (isLoop(l) ? 1 : 0);
  for (let k = 0; k < count; k++) l.vehicles.push({ i: Math.floor(k * n / count) % n, j: null, t: 0, dir: 1, dwell: 0, load: [] });
}

// 노선 하나의 정류장 목록이 규칙에 맞는지 본다. 바꾸려는 목록 전체를 검사하므로 연장·끼워 넣기·빼기에 모두 쓴다
const candLoop = c => c.length > 3 && c[0] === c[c.length - 1];
const candSegs = c => c.slice(1).map((s, i) => [c[i], s]);
function lineError(l, cand) {
  const loop = candLoop(cand), uniq = cand.length - (loop ? 1 : 0);
  if (new Set(cand).size !== uniq) return 'same';
  const maxStops = maxStopsOf(l.mode);
  if (uniq > maxStops) return MODES[l.mode].name + ' 노선은 정류장 ' + maxStops + '곳까지입니다';
  if (l.mode === 'exp' && cand.some(s => !s.hub)) return '급행은 환승 센터에만 섭니다';
  if (l.mode === 'ferry' && cand.some(s => !s.pier)) return '여객선은 선착장끼리만 잇습니다';
  const segs = candSegs(cand);
  if (l.mode === 'bus') {
    if (segs.some(([x, y]) => crossesMountain(x, y))) return '버스는 산을 넘지 못합니다. 돌아가세요';
    if (city.busMax && segs.reduce((n, [x, y]) => n + dist(x, y), 0) > city.busMax + 1e-6) return '시내버스 노선은 길이 ' + city.busMax + '을 넘을 수 없습니다';
    const cross = segs.reduce((n, [x, y]) => n + crossings(x, y), 0);
    if (cross && !city.bridges) return '넓은 만은 다리로 건널 수 없습니다';
    if (cross > lineCross(l) && bridgesUsed() - lineCross(l) + cross > bridges) return '다리가 모자랍니다';
  }
  if (l.mode === 'sub') {
    const mine = l.stops.reduce((n, q, i) => n + (i ? segTrack(l.stops[i - 1], q) : 0), 0);
    const next = segs.reduce((n, [x, y]) => n + segTrack(x, y), 0);
    if (next > mine && trackUsed() - mine + next > track + 1e-6) {
      return segs.some(([x, y]) => crossings(x, y) || crossesMountain(x, y)) ? '선로가 모자랍니다 (터널은 +' + city.tunnel + ')' : '선로가 모자랍니다';
    }
  }
  return '';
}

// 노선의 정류장 목록을 바꾼다. 차량은 처음으로 돌려보내지 않고 가까운 정류장에서 이어 달린다
function setStops(l, cand) {
  const old = l.stops;
  if (cand.length < 2) { dumpLoads(l); l.stops = []; l.vehicles = []; rebuildD(); return; }
  if (old.length < 2 || l.vehicles.length !== vehCount(l)) { dumpLoads(l); l.stops = cand; resetVehicles(l); rebuildD(); return; }
  l.stops = cand;
  const loop = isLoop(l), n = cand.length - (loop ? 1 : 0);
  for (const v of l.vehicles) {
    const a = old[v.i], b = v.j == null ? null : old[v.j];
    let ia = cand.indexOf(a);
    if (ia < 0) {
      // 서던 정류장이 노선에서 빠졌다: 가장 가까운 정류장으로 옮기고, 탄 승객은 거기서 내려 다시 길을 찾는다
      let bd = Infinity;
      for (let k = 0; k < n; k++) { const dd = dist(cand[k], a); if (dd < bd) { bd = dd; ia = k; } }
      cand[ia].wait.push(...v.load); v.load = [];
      v.i = ia; v.j = null; v.t = 0; v.dwell = 0;
      continue;
    }
    if (loop && ia === cand.length - 1) ia = 0;
    v.i = ia;
    if (b && cand[ia + 1] === b) { v.j = ia + 1; v.dir = 1; }
    else if (b && !loop && ia > 0 && cand[ia - 1] === b) { v.j = ia - 1; v.dir = -1; }
    else { v.j = null; v.t = 0; }
  }
  rebuildD();
}

// 노선 끝(뒤 또는 앞)에 정류장을 붙인다
function append(l, s, head) {
  const n = l.stops.length;
  if (n && isLoop(l)) return false;                        // 이미 닫힌 고리: 끌기 중에는 조용히 무시
  if (n && (head ? l.stops[0] : l.stops[n - 1]) === s) return false;
  const closing = n >= 3 && (head ? l.stops[n - 1] : l.stops[0]) === s;
  if (l.stops.includes(s) && !closing) return false;
  const cand = head ? [s].concat(l.stops) : l.stops.concat([s]);
  const err = lineError(l, cand);
  if (err) { if (err !== 'same') editError(s, err); return false; }
  setStops(l, cand);
  fxRing(s.x, s.y, l.color, 26, 0.45, 3);
  if (isLoop(l)) { flash('순환 노선 완성!'); sfxHub(); fxRing(s.x, s.y, l.color, 44, 0.8, 4); }
  else sfxConnect(l.stops.length - 1);
  return true;
}
// 같은 정류장 위에서 손가락을 움직일 때마다 오류음이 반복되지 않게 한 번만 알린다
let errStop = null;
function editError(s, err) { if (errStop === s) return; errStop = s; flash(err); sfxError(); }

// 구간 k(정류장 k와 k+1 사이)에 정류장을 끼워 넣는다
function insertStop(l, k, s) {
  if (l.stops.includes(s)) return false;
  const cand = l.stops.slice(); cand.splice(k + 1, 0, s);
  const err = lineError(l, cand);
  if (err) { if (err !== 'same') editError(s, err); return false; }
  setStops(l, cand);
  fxRing(s.x, s.y, l.color, 30, 0.5, 3); sfxConnect(cand.length - 1);
  return true;
}
// 노선에서 정류장 하나를 뺀다. 앞뒤 정류장이 바로 이어진다
function removeStop(l, s) {
  let cand;
  if (isLoop(l)) {
    const ring = l.stops.slice(0, -1).filter(x => x !== s);
    cand = ring.length >= 3 ? ring.concat([ring[0]]) : ring;
  } else cand = l.stops.filter(x => x !== s);
  if (cand.length < 2) cand = [];
  const err = cand.length ? lineError(l, cand) : '';
  if (err && err !== 'same') { flash('뺄 수 없습니다: ' + err); sfxError(); return false; }
  setStops(l, cand);
  fxRing(s.x, s.y, '#888', 30, 0.5, 3); sfxUndo();
  flash(cand.length ? '정류장을 뺐습니다' : '노선이 비었습니다');
  return true;
}

function undoLast(l) {
  if (!l.stops.length) return;
  dumpLoads(l);
  l.stops.pop();
  if (l.stops.length < 2) l.stops = [];
  resetVehicles(l);
  rebuildD();
}

function clearLine(l) {
  dumpLoads(l);
  l.stops = [];
  spare[l.mode] += l.extra; l.extra = 0;
  resetVehicles(l);
  rebuildD();
}

function addVehicle(l) {
  if (l.stops.length < 2) return flash('먼저 노선을 그리세요');
  if (spare[l.mode] < 1) return flash('여유 ' + VEHICLE_NAME[l.mode] + '이(가) 없습니다');
  spare[l.mode]--; l.extra++; resetVehicles(l); rebuildD(); sfxVehicle();
}
function removeVehicle(l) {
  if (l.extra < 1) return flash('뺄 수 있는 차량이 없습니다');
  spare[l.mode]++; l.extra--; resetVehicles(l); rebuildD();
}

// 임시 증편: 하루 한 번, 고른 노선의 차량을 잠깐 두 배로
function useBoost(l) {
  if (boostLeft < 1) return flash('임시 증편은 하루에 한 번입니다');
  if (l.stops.length < 2) return flash('먼저 노선을 그리세요');
  boostLeft--; l.boost = BOOST_SEC;
  resetVehicles(l); rebuildD(); sfxVehicle();
  flash(MODES[l.mode].name + ' ' + l.n + ' 임시 증편! ' + BOOST_SEC + '초 동안 차량 2배');
}
// 신도시: 다음에 개발할 구역을 고르게 한다
function startSiteChoice() {
  const un = districts.filter(d => d.built === false);
  if (!un.length) return;
  if (un.length === 1) return buildDistrict(un[0]);
  siteChoice = shuffle(un.slice()).slice(0, 2).map(d => d.id);
}
function buildDistrict(d) {
  d.built = true; siteChoice = null;
  addStop(d); bgDirty = true;
  flash(TYPE_NAME[d.type] + ' 구역이 들어섰습니다'); sfxHub(); saveGame();
}

// ---------- 경로 탐색 ----------
const segCost = (l, a, b) => dist(a, b) / modeSpeed(l.mode) + MODES[l.mode].dwell;
function roundTrip(l) {
  let t = 0;
  for (let i = 1; i < l.stops.length; i++) t += segCost(l, l.stops[i - 1], l.stops[i]);
  return isLoop(l) ? t : t * 2;
}
// 배차 간격: 한 바퀴 도는 시간을 차량 수로 나눈 값
const headway = l => l.stops.length < 2 ? Infinity : roundTrip(l) / vehCount(l);
const transferTime = s => s.hub ? HUB_TRANSFER : TRANSFER;

// D[구역][노드] = 그 구역까지 걸리는 예상 시간.
// 노드는 정류장(0..n-1)과 "노선 위의 정류장"(l.node0 + 순번) 두 종류다.
// 정류장에서 노선에 타는 데에는 평균 대기(배차 간격의 절반)와 환승 시간이 든다.
function rebuildD() {
  const n = stops.length;
  let N = n;
  for (const l of lines) {
    l.m = l.stops.length < 2 ? 0 : (isLoop(l) ? l.stops.length - 1 : l.stops.length);
    l.node0 = N; N += l.m;
  }
  const radj = Array.from({ length: N }, () => []);     // 거꾸로 된 간선: radj[도착] = [출발, 비용]
  const edge = (u, v, c) => radj[v].push([u, c]);
  for (const l of lines) {
    if (!l.m) continue;
    const loop = isLoop(l), hw = headway(l);
    for (let k = 0; k < l.m; k++) {
      const s = l.stops[k], ln = l.node0 + k;
      edge(s.idx, ln, hw / 2 + transferTime(s));
      edge(ln, s.idx, 0);
      if (k + 1 < l.stops.length) {
        const c = segCost(l, s, l.stops[k + 1]), ln2 = l.node0 + ((k + 1) % l.m);
        edge(ln, ln2, c);
        if (!loop) edge(ln2, ln, c);                      // 순환선은 한 방향으로만 돈다
      }
    }
  }
  D = districts.map(d => {
    const dd = new Array(N).fill(Infinity), done = new Array(N).fill(false);
    for (const s of stops) if (s.d === d.id) dd[s.idx] = 0;
    for (;;) {
      let u = -1;
      for (let i = 0; i < N; i++) if (!done[i] && dd[i] < Infinity && (u < 0 || dd[i] < dd[u])) u = i;
      if (u < 0) break;
      done[u] = true;
      for (const [v, w] of radj[u]) if (dd[u] + w < dd[v]) dd[v] = dd[u] + w;
    }
    return dd;
  });
}

// ---------- 진행 ----------
function nextIdx(l, v) {
  const n = l.stops.length;
  if (isLoop(l)) return v.i + 1;
  if (v.i + v.dir < 0 || v.i + v.dir > n - 1) v.dir = -v.dir;
  return v.i + v.dir;
}

// 여정 한 건의 점수(0~100)를 출발 구역과 오늘 성적에 반영한다
function recordTrip(from, score) {
  const d = districts[from];
  d.sat = d.sat * 0.88 + score * 0.12;
  dayS.sum += score; dayS.n++;
}
// 도착한 승객의 여정 점수: 걸린 시간이 이상적인 시간의 3배면 0점, 환승과 만차는 추가 감점
function tripScore(p) {
  const ratio = (now - p.born) / p.ideal;
  const base = 100 - Math.max(0, ratio - 1) * 50;
  return Math.max(0, Math.min(100, base - (p.tr || 0) * SAT_TRANSFER - (p.miss || 0) * SAT_MISSED));
}
// 이상적인 여정 시간: 목적 구역의 가장 가까운 정류장까지 기준 속도로 곧장 가는 시간 + 기준 대기
function idealTime(s, dest) {
  let best = Infinity;
  let bestStop = null;
  for (const o of stops) if (o.d === dest && dist(s, o) < best) { best = dist(s, o); bestStop = o; }
  // 물을 건너야 하는 여정은 그만큼 기준을 늦춰 준다(항구 도시)
  const water = bestStop && city.allow && (crossings(s, bestStop) || crossesMountain(s, bestStop)) ? city.allow : 0;
  return best / SAT_REF_SPEED + SAT_REF_WAIT + water;
}

// 정류장에 도착: 목적지면 내리고, 이 차로 계속 가는 게 최선이 아니면 갈아타려고 내린다.
// 기다리던 승객은 이 노선을 타는 것이 가만히 있는 것보다 나을 때만 탄다.
function exchange(l, v) {
  const s = l.stops[v.i], nxt = l.stops[v.j], cap = modeCap(l.mode), w = segCost(l, s, nxt);
  const ni = l.node0 + (v.i % l.m), nj = l.node0 + (v.j % l.m);
  const onward = p => { const dd = D[p.dest]; return dd[ni] < Infinity && dd[nj] + w <= dd[ni] + 1e-6; };
  const keep = [];
  for (const p of v.load) {
    if (s.d === p.dest) {
      delivered++;
      const col = districts[p.dest].color, score = tripScore(p);
      if (!p.gave) recordTrip(p.from, score);
      // 여정이 만족스러울수록 초록, 나쁠수록 빨강
      fxBurst(s.x, s.y, col, 5, 60); fxFloat(s.x, s.y, '+1', score >= 70 ? '#1a8f3a' : score >= 40 ? '#d98a00' : '#d64545'); sfxDeliver(p.dest);
    }
    else if (onward(p)) keep.push(p);
    else { p.ready = now + transferTime(s); p.tr = (p.tr || 0) + 1; s.wait.push(p); }
  }
  v.load = keep;
  const rest = [];
  for (const p of s.wait) {
    const wants = (p.ready || 0) <= now && onward(p) && D[p.dest][ni] < D[p.dest][s.idx] - 1e-6;
    if (wants && v.load.length < cap) { v.load.push(p); l.rides = (l.rides || 0) + 1; }   // 탑승 수: 분담률 계산용
    else { if (wants) p.miss = (p.miss || 0) + 1; rest.push(p); }    // 타려 했는데 만차
  }
  s.wait = rest;
}

function moveVehicle(l, v, dt) {
  const n = l.stops.length;
  if (n < 2) return;
  if (v.i > n - 1) { v.i = 0; v.t = 0; v.j = null; }
  if (v.j == null || v.j > n - 1) { v.j = nextIdx(l, v); v.t = 0; exchange(l, v); }
  if (v.dwell > 0) { v.dwell -= dt; return; }
  v.t += modeSpeed(l.mode) * dt / (dist(l.stops[v.i], l.stops[v.j]) || 1);
  if (v.t >= 1) {
    v.i = v.j; v.t = 0;
    if (isLoop(l) && v.i === n - 1) v.i = 0;
    v.j = nextIdx(l, v);
    v.dwell = MODES[l.mode].dwell;
    exchange(l, v);
  }
}

function pickDest(s) {
  const from = districts[s.d];
  const has = d => d.id !== s.d && stops.some(x => x.d === d.id);
  const w = DEST[phase()][from.type];
  // 축제 도시: 행사 전에는 관객 일부가 경기장으로 향한다
  if (city.eventEnd && from.type !== 'V' && clock >= city.eventStart * DAY && clock < city.eventEnd * DAY && Math.random() < 0.35) {
    const venue = districts.find(d => d.type === 'V' && has(d));
    if (venue) return venue.id;
  }
  let roll = Math.random(), type = null;
  for (const k in w) { if (roll < w[k]) { type = k; break; } roll -= w[k]; }
  let pool = districts.filter(d => d.type === type && has(d));
  if (!pool.length) pool = districts.filter(d => d.type !== 'V' && has(d));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)].id : null;
}

function step(dt) {
  clock += dt; now += dt;
  if (clock >= DAY) { clock = 0; offerReward(); return; }
  // 임시 증편이 끝나면 차량을 되돌린다
  if (reviveT > 0) { reviveT -= dt; if (reviveT <= 0) { reviveT = 0; flash('부활 효과가 끝났습니다'); } }
  for (const l of lines) if (l.boost > 0) { l.boost -= dt; if (l.boost <= 0) { l.boost = 0; resetVehicles(l); rebuildD(); renderTools(); } }
  // 축제 도시: 행사가 끝나는 순간부터 관객이 몇 초에 걸쳐 쏟아져 나온다
  if (city.eventEnd) {
    const end = city.eventEnd * DAY;
    if (clock >= end && clock - dt < end) { burstLeft = 24 + 6 * day; burstAcc = 0; flash('행사가 끝났습니다! 관객 ' + burstLeft + '명이 쏟아져 나옵니다'); sfxPhase(); }
    if (burstLeft > 0) {
      burstAcc += dt * 6;
      const venues = stops.filter(isVenue), homes = districts.filter(d => d.type === 'R' && stops.some(x => x.d === d.id));
      while (burstAcc >= 1 && burstLeft > 0) {
        burstAcc -= 1; burstLeft--;
        if (!venues.length || !homes.length) continue;
        const s = venues[Math.floor(Math.random() * venues.length)], dest = homes[Math.floor(Math.random() * homes.length)].id;
        s.wait.push({ dest, from: s.d, born: now, ideal: idealTime(s, dest) });
      }
    }
  }
  if (schedDay !== day) makeSchedule();
  const nx = sched[0];
  stopTimer = nx ? nx.t - clock : Infinity;
  if (nx && !nx.crowd && stopTimer <= FORECAST && !pendingStop) planStop();
  if (nx && clock >= nx.t) { sched.shift(); if (nx.crowd) crowdUp(); else spawnStop(); }
  const ph = phase(), rate = BASE_RATE * (1 + (day - 1) * DAY_GROWTH) * (1 + 0.08 * crowdLv);
  for (const s of stops) {
    if (!s.pier) s.acc += rate * (GEN[ph][districts[s.d].type] || 0) * dt;
    while (s.acc >= 1) { s.acc -= 1; const dest = pickDest(s); if (dest != null) s.wait.push({ dest, from: s.d, born: now, ideal: idealTime(s, dest) }); }
    if (s.wait.length > capOf(s)) s.over += dt / OVER_SEC;
    else s.over = Math.max(0, s.over - dt / OVER_SEC * 0.7);
    if (s.over >= 1) over = true;
    // 처음 반쯤 찼을 때 한 번 크게 알린다
    if (s.over > 0.5 && !s.warned) { s.warned = true; flash(stopName(s) + '이 넘칩니다! 노선을 잇거나 증차하세요'); buzz(70); }
    else if (s.over === 0) s.warned = false;
    // 너무 오래 기다린 승객은 0점으로 한 번만 집계한다(끝내 못 가도 성적에 잡히게)
    for (const p of s.wait) if (!p.gave && now - p.born > p.ideal * 3 + 20) { p.gave = true; recordTrip(p.from, 0); }
  }
  for (const l of lines) for (const v of l.vehicles) moveVehicle(l, v, dt);
  if (phase() !== lastPhase) { lastPhase = phase(); sfxPhase(); }
  if (stops.some(s => s.over > 0.5)) sfxWarn();
  if (over) gameOver();
}

  if (lv('cap', 'bus') < 6) others.push({ ic: 'bus', title: '버스 대형화 ' + (lv('cap', 'bus') / 3 + 1) + '단계', desc: '모든 버스 정원 +3', run: () => { upg.cap.bus = lv('cap', 'bus') + 3; } });
  if (lv('cap', 'sub') < 16) others.push({ ic: 'train', title: '객차 추가 ' + (lv('cap', 'sub') / 8 + 1) + '단계', desc: '모든 열차 정원 +8', run: () => { upg.cap.sub = (upg.cap.sub || 0) + 8; } });
  if (lv('speed', 'bus') < 2) others.push({ ic: 'fast', title: '버스 전용차로 ' + (lv('speed', 'bus') + 1) + '단계', desc: '모든 버스 속도 +20%', run: () => { upg.speed.bus = lv('speed', 'bus') + 1; } });
  if (lv('speed', 'sub') < 2) others.push({ ic: 'fast', title: '신호 개량 ' + (lv('speed', 'sub') + 1) + '단계', desc: '모든 열차 속도 +20%', run: () => { upg.speed.sub = lv('speed', 'sub') + 1; } });
  if (upg.stops < 2) others.push({ ic: 'plus', title: '노선 연장 허가', desc: '버스·지하철 노선 정류장 +2곳', run: () => { upg.stops++; } });
  if (city.bridges) others.push({ ic: 'bridge', title: '다리 +1', desc: '버스가 강을 한 번 더 건넘', run: () => { bridges += 1; } });
  if (city.special) {

    vehicles.push({ ic: MODE_ICON[sp], title: nm + ' 1' + SPECIAL_UNIT[sp], desc: '원하는 ' + MODES[sp].name + ' 노선에 증편', run: () => { spare[sp] = (spare[sp] || 0) + 1; } });
    const fl = lines.find(l => l.mode === sp && !l.unlocked);
    if (lv('cap', sp) < MODES[sp].cap) others.push({ ic: MODE_ICON[sp], title: MODES[sp].name + ' 개량', desc: '모든 ' + nm + ' 정원 +' + Math.ceil(MODES[sp].cap / 2), run: () => { upg.cap[sp] = lv('cap', sp) + Math.ceil(MODES[sp].cap / 2); } });
    if (fl) expand.push({ ic: MODE_ICON[sp], title: MODES[sp].name + ' 노선 +1', desc: nm + ' 1' + SPECIAL_UNIT[sp] + ' 포함', run: () => { fl.unlocked = true; } });
  }
  // 하루 성적: 평균 만족도로 등급을 매기고, 등급에 따라 선택지 수가 달라진다
  const avg = dayAverage();
  if (!graded) { graded = true; lowDays = avg < FIRE_BELOW ? lowDays + 1 : 0; satDays.push(avg); }
  if (lowDays >= FIRE_DAYS) { over = true; gameOver('fired'); return; }
  const grade = avg >= GRADE_GOOD ? '우수' : avg >= GRADE_OK ? '보통' : '미흡';
  const baseChoices = avg >= GRADE_GOOD ? 4 : avg >= GRADE_OK ? 3 : 2;
  const choices = Math.min(4, baseChoices + (adUse.more ? 1 : 0));
  // 차량 하나와 (남아 있으면) 새 노선 하나는 반드시 넣고, 나머지는 개량·자원에서 고른다
  const must = [shuffle(vehicles, Math.random)[0]];
  if (expand.length) must.push(shuffle(expand, Math.random)[0]);
  const pool = shuffle(others.concat(expand.filter(o => !must.includes(o))), Math.random);
  rewardOpts = shuffle(must.concat(pool.slice(0, Math.max(0, choices - must.length))), Math.random);
  const done = day === GOAL_DAY && !cleared;
  let doneMsg = rewardDoneMsg;
  if (done) {
    // 완주: 별을 매기고 진행 상황에 기록한다. 다음 도시가 열린다
    cleared = true;
    const mean = satDays.reduce((a, b) => a + b, 0) / Math.max(1, satDays.length);
    // 별 3개는 부활 없이 완주해야 받는다
    const stars = Math.min(adUse.revived ? 2 : 3, 1 + (mean >= 70 ? 1 : 0) + (mean >= 85 ? 1 : 0));
    const prog = readProg(), old = prog[city.id] || {};
    prog[city.id] = { cleared: true, stars: Math.max(stars, old.stars || 0), best: Math.max(delivered, old.best || 0) };
    writeProg(prog);
    const next = CITIES.find(c => c.needs === city.id && !c.soon);
    doneMsg = '평균 만족도 ' + Math.round(mean) + '% · ' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + '. '
      + (adUse.revived ? '(부활 사용) ' : '') + (next && !old.cleared ? next.name + '가 열렸습니다! ' : '') + '여기부터는 무한 모드입니다. ';
    rewardDoneMsg = doneMsg; rewardDoneTitle = true;
  }
  $('rTitle').textContent = rewardDoneTitle ? GOAL_DAY + '일 완주!' : day + '일차 운영 종료';
  $('rGrade').className = 'grade ' + (choices === 4 ? 'good' : choices === 3 ? 'ok' : 'bad');
  $('rGrade').innerHTML = icon('smile', 18) + '<span>시민 만족도 <b>' + avg + '%</b> · ' + grade + '</span>';
  $('rSub').textContent = doneMsg
    + (lowDays ? '경고: 내일도 만족도가 ' + FIRE_BELOW + '% 미만이면 해임됩니다. ' : '')
    + '시의회가 지원 ' + choices + '가지를 제안합니다. 하나를 고르세요.';
  for (let i = 0; i < 4; i++) {
    const o = rewardOpts[i];
    $('r' + i).style.display = o ? '' : 'none';
    if (o) $('r' + i).innerHTML = '<div class="ric">' + icon(o.ic, 26) + '</div><b>' + o.title + '</b><span>' + o.desc + '</span>';
  }
  // 광고 보상: 하루 한 번씩
  $('adReroll').hidden = adUse.reroll;
  $('adReroll').innerHTML = adLabel('지원 다시 뽑기');
  $('adMore').hidden = adUse.more || baseChoices >= 4;
  $('adMore').innerHTML = adLabel('지원 하나 더');
  $('premR').innerHTML = premNudge();
  $('reward').classList.remove('hide');
  sfxDayEnd();
}

function failTips(s) {
  const tips = [], ls = lines.filter(l => l.stops.length > 1 && l.stops.includes(s));
  const head = (s.d >= 0 ? dot(districts[s.d]) : '') + stopName(s) + '에 ' + s.wait.length + '명이 몰렸습니다 (정원 ' + capOf(s) + '명)';
  const cnt = {};
  for (const q of s.wait) cnt[q.dest] = (cnt[q.dest] || 0) + 1;
  const lost = Object.keys(cnt).filter(k => D[k] && D[k][s.idx] === Infinity);
  if (!ls.length) tips.push('이 정류장에는 다니는 노선이 없었습니다. 가까운 노선의 선을 끌어 이 정류장에 끼워 넣어 보세요.');
  if (lost.length) {
    const n = lost.reduce((m, k) => m + cnt[k], 0);
    tips.push(lost.map(k => dot(districts[k]) + TYPE_NAME[districts[k].type]).join(', ') + ' 구역으로 가는 길이 없어 ' + n + '명이 발이 묶였습니다. 그 구역까지 노선을 이어 주세요.');
  }
  if (ls.length) {
    const hw = Math.min(...ls.map(headway));
    if (hw > 14) tips.push('배차 간격이 ' + Math.round(hw) + '초였습니다. 증차하거나 긴 노선을 둘로 나눠 보세요.');

    if (!s.hub && hubs > 0) tips.push('환승 센터로 지정하면 20명까지 기다릴 수 있습니다. 남은 환승 센터가 ' + hubs + '개 있었습니다.');
  }
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (top && !lost.includes(top[0]) && tips.length < 3) tips.push('가장 많은 승객(' + top[1] + '명)이 ' + dot(districts[top[0]]) + TYPE_NAME[districts[top[0]].type] + ' 구역으로 가려 했습니다. 그쪽으로 곧장 가는 노선이 있으면 빨라집니다.');

function resize() {
  const box = { width: cv.parentElement.clientWidth, height: cv.parentElement.clientHeight };   // 테두리 안쪽 크기
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(box.width * dpr)); cv.height = Math.max(1, Math.round(box.height * dpr));
  cv.style.width = box.width + 'px'; cv.style.height = box.height + 'px';
  scale = Math.min(box.width / W, box.height / H);
  ox = (box.width - W * scale) / 2; oy = (box.height - H * scale) / 2;
}
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}
function stopAt(p) {
  let best = null, bd = 26;
  for (const s of stops) { const d = dist(p, s); if (d < bd) { bd = d; best = s; } }
  return best;
}
const locked = () => !started || over || rewardOpts;

    const q = toLogical(e), d = siteChoice.map(id => districts[id]).find(d => dist(d, q) < d.r);
    if (d) { buildDistrict(d); renderTools(); }
    return;
  }
  if (locked()) return;
  const p = toLogical(e), s = stopAt(p);
  if (hubMode && !s) return;
  if (hubMode) {
    if (s.hub) {   // 이미 환승 센터면 해제하고 돌려받는다
      if (lines.some(l => l.mode === 'exp' && l.stops.includes(s))) return flash('급행이 서는 환승 센터는 해제할 수 없습니다');
      s.hub = false; hubs++; hubMode = false;
      fxRing(s.x, s.y, '#888', 40, 0.6, 3); sfxUndo(); flash('환승 센터를 해제했습니다');
      rebuildD(); renderTools();
      return;
    }

const tutFreeze = () => tut && TUT[tut.i] && TUT[tut.i].freeze;
const tutHint = () => tut && TUT[tut.i] && TUT[tut.i].hint ? TUT[tut.i].hint() : null;
$('cSkip').onclick = () => { sfxClick(); endTut(true); flash('튜토리얼은 설정에서 다시 볼 수 있습니다'); };
$('cNext').onclick = () => { sfxClick(); tutGo(tut.i + 1); };
// 지난번에 도시마다 어떤 지도로 했는지 기억해 둔다(같은 지도로 다시 하기)
const SEED_KEY = 'transit-lastseed';
function lastSeeds() { try { return JSON.parse(localStorage.getItem(SEED_KEY)) || {}; } catch (e) { return {}; } }
function beginGame() {
  tutRun = false;
  clearSave(); $('start').classList.add('hide'); $('over').classList.add('hide'); started = true; audioInit(); sfxDayEnd();
  try { const m = lastSeeds(); m[city.id] = mapSeed; localStorage.setItem(SEED_KEY, JSON.stringify(m)); } catch (e) {}
  flash(city.name + ' · ' + city.tag + ' · 지도 #' + mapSeed);
}
$('startBtn').onclick = () => { beginGame(); if (!tutDone() && city.id === CITIES[0].id) startTut(); };
$('sameBtn').onclick = () => { sfxClick(); newGame(lastSeeds()[city.id]); beginGame(); };
$('retryBtn').onclick = () => { sfxClick(); Ads.betweenGames(); clearSave(); newGame(mapSeed); beginGame(); };
$('contBtn').onclick = () => { audioInit(); if (loadGame()) { $('start').classList.add('hide'); started = true; sfxDayEnd(); } };
$('saveBtn').onclick = () => { saveGame(true); sfxClick(); };
// 홈: 지금 판을 저장해 두고 도시 선택 화면으로 돌아간다
$('homeBtn').onclick = () => {
  sfxClick();
  if (!started) return;
  saveGame();
  started = false; hubMode = false; drawing = false; endTut(false);
  $('reward').classList.add('hide'); $('over').classList.add('hide');
  newGame();      // 화면 뒤에는 같은 도시의 새 판을 깔아 둔다. 하던 판은 이어하기로 돌아온다
  showStart();
};
// 자동 저장: 5초마다, 그리고 화면을 떠날 때
setInterval(() => { if (!rewardOpts) saveGame(); }, 5000);
addEventListener('pagehide', () => saveGame());
document.addEventListener('visibilitychange', () => { if (document.hidden) appPause(); else appResume(); });
applySettings();
$('muteBtn').innerHTML = icon('sound', 16);
$('muteBtn').onclick = () => { audioInit(); setMuted(!AU.muted); $('muteBtn').innerHTML = icon(AU.muted ? 'mute' : 'sound', 16); };
addEventListener('pointerdown', audioInit, { passive: true });
$('againBtn').onclick = () => { Ads.betweenGames(); clearSave(); started = false; endTut(false); newGame(); showStart(); };
$('r0').onclick = () => takeReward(0);
$('r1').onclick = () => takeReward(1);
$('r2').onclick = () => takeReward(2);
$('r3').onclick = () => takeReward(3);
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('wrap'));

newGame();
// 도시 선택 화면을 연다. 저장된 판이 있으면 이어하기 버튼을 보여 준다
function showStart() {
  renderCities();
  const sv = readSave();
  $('contBtn').style.display = sv ? '' : 'none';
  if (sv) $('contBtn').textContent = (sv.city || '도시') + ' 이어하기 · ' + sv.day + '일차';
  $('start').classList.remove('hide');
}
showStart();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
